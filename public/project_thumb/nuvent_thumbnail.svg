<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0918" />
      <stop offset="100%" stop-color="#1d1230" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  <rect width="100%" height="100%" fill="url(#grid)" />
  
  <!-- Ambient glow orb -->
  <circle cx="400" cy="240" r="180" fill="#A855F7" opacity="0.08" filter="url(#glow)" />
  
  <!-- Icon / Graphics illustration -->
  <g><rect x="330" y="160" width="140" height="160" rx="14" fill="none" stroke="#A855F7" stroke-width="3" filter="url(#glow)"/>
           <line x1="355" y1="195" x2="445" y2="195" stroke="#C084FC" stroke-width="2" stroke-linecap="round"/>
           <line x1="355" y1="225" x2="420" y2="225" stroke="#C084FC" stroke-width="2" stroke-linecap="round"/>
           <line x1="355" y1="255" x2="445" y2="255" stroke="#C084FC" stroke-width="2" stroke-linecap="round"/>
           <circle cx="400" cy="290" r="10" fill="#A855F7" filter="url(#glow)"/></g>
  
  <!-- Content overlay -->
  <g font-family="system-ui, -apple-system, sans-serif">
    <!-- Tag -->
    <rect x="40" y="40" width="140" height="26" rx="13" fill="#4C1D95" opacity="0.6"/>
    <text x="50" y="57" font-size="11" font-weight="700" fill="#A855F7" letter-spacing="1">EVENT PLATFORM</text>
    
    <!-- Title and Subtitle -->
    <text x="40" y="420" font-size="28" font-weight="800" fill="#F8FAFC" letter-spacing="-0.5">Nuvent</text>
    <text x="40" y="450" font-size="14" font-weight="400" fill="#94A3B8">Event management software built under Varunya Technologies.</text>
  </g>
</svg>
