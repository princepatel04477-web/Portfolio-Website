<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051311" />
      <stop offset="100%" stop-color="#0b231d" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  <rect width="100%" height="100%" fill="url(#grid)" />
  
  <!-- Ambient glow orb -->
  <circle cx="400" cy="240" r="180" fill="#10B981" opacity="0.08" filter="url(#glow)" />
  
  <!-- Icon / Graphics illustration -->
  <g><path d="M100 350 L220 280 L320 310 L440 210 L560 250 L680 140" stroke="#10B981" stroke-width="4" fill="none" stroke-linecap="round"/>
           <circle cx="680" cy="140" r="8" fill="#10B981" filter="url(#glow)"/>
           <rect x="200" y="220" width="16" height="70" fill="#10B981" opacity="0.6"/>
           <rect x="300" y="270" width="16" height="50" fill="#EF4444" opacity="0.6"/>
           <rect x="420" y="170" width="16" height="60" fill="#10B981" opacity="0.7"/>
           <rect x="540" y="220" width="16" height="40" fill="#10B981" opacity="0.8"/></g>
  
  <!-- Content overlay -->
  <g font-family="system-ui, -apple-system, sans-serif">
    <!-- Tag -->
    <rect x="40" y="40" width="140" height="26" rx="13" fill="#064E3B" opacity="0.6"/>
    <text x="50" y="57" font-size="11" font-weight="700" fill="#10B981" letter-spacing="1">FINTECH & AI</text>
    
    <!-- Title and Subtitle -->
    <text x="40" y="420" font-size="28" font-weight="800" fill="#F8FAFC" letter-spacing="-0.5">TRADEX (Tradly)</text>
    <text x="40" y="450" font-size="14" font-weight="400" fill="#94A3B8">AI Forex Intelligence & Paper-Trading Platform</text>
  </g>
</svg>