<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071017" />
      <stop offset="100%" stop-color="#0e1f2c" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  <rect width="100%" height="100%" fill="url(#grid)" />
  
  <!-- Ambient glow orb -->
  <circle cx="400" cy="240" r="180" fill="#38BDF8" opacity="0.08" filter="url(#glow)" />
  
  <!-- Icon / Graphics illustration -->
  <g><polygon points="400,170 450,200 450,260 400,290 350,260 350,200" fill="none" stroke="#38BDF8" stroke-width="3" filter="url(#glow)"/>
           <polygon points="470,210 520,240 520,300 470,330 420,300 420,240" fill="none" stroke="#0284C7" stroke-width="2" opacity="0.6"/>
           <polygon points="330,210 380,240 380,300 330,330 280,300 280,240" fill="none" stroke="#0284C7" stroke-width="2" opacity="0.6"/>
           <circle cx="400" cy="230" r="10" fill="#38BDF8"/></g>
  
  <!-- Content overlay -->
  <g font-family="system-ui, -apple-system, sans-serif">
    <!-- Tag -->
    <rect x="40" y="40" width="140" height="26" rx="13" fill="#0C4A6E" opacity="0.6"/>
    <text x="50" y="57" font-size="11" font-weight="700" fill="#38BDF8" letter-spacing="1">PHARMA EXPORT B2B</text>
    
    <!-- Title and Subtitle -->
    <text x="40" y="420" font-size="28" font-weight="800" fill="#F8FAFC" letter-spacing="-0.5">Arvex Pharma (Concept)</text>
    <text x="40" y="450" font-size="14" font-weight="400" fill="#94A3B8">High-Performance Edge-Hosted Wholesale Prototype</text>
  </g>
</svg>