<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0e0c" />
      <stop offset="100%" stop-color="#1f1a14" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  <rect width="100%" height="100%" fill="url(#grid)" />
  
  <!-- Ambient glow orb -->
  <circle cx="400" cy="240" r="180" fill="#F59E0B" opacity="0.08" filter="url(#glow)" />
  
  <!-- Icon / Graphics illustration -->
  <g><g stroke="#F59E0B" stroke-width="2" opacity="0.6">
             <line x1="260" y1="180" x2="540" y2="180"/><line x1="260" y1="220" x2="540" y2="220"/>
             <line x1="260" y1="260" x2="540" y2="260"/><line x1="260" y1="300" x2="540" y2="300"/>
             <line x1="300" y1="150" x2="300" y2="330"/><line x1="360" y1="150" x2="360" y2="330"/>
             <line x1="420" y1="150" x2="420" y2="330"/><line x1="480" y1="150" x2="480" y2="330"/>
           </g>
           <circle cx="420" cy="220" r="16" fill="#F59E0B" filter="url(#glow)"/></g>
  
  <!-- Content overlay -->
  <g font-family="system-ui, -apple-system, sans-serif">
    <!-- Tag -->
    <rect x="40" y="40" width="140" height="26" rx="13" fill="#451A03" opacity="0.6"/>
    <text x="50" y="57" font-size="11" font-weight="700" fill="#F59E0B" letter-spacing="1">B2B TEXTILE PORTAL</text>
    
    <!-- Title and Subtitle -->
    <text x="40" y="420" font-size="28" font-weight="800" fill="#F8FAFC" letter-spacing="-0.5">Maa Sheetla × Sunrise</text>
    <text x="40" y="450" font-size="14" font-weight="400" fill="#94A3B8">Dual-Brand Textile Platform & Zero-Cost Backend</text>
  </g>
</svg>