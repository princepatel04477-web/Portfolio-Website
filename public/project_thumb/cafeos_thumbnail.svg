<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120d08" />
      <stop offset="100%" stop-color="#24170e" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  <rect width="100%" height="100%" fill="url(#grid)" />
  
  <!-- Ambient glow orb -->
  <circle cx="400" cy="240" r="180" fill="#FB923C" opacity="0.08" filter="url(#glow)" />
  
  <!-- Icon / Graphics illustration -->
  <g><rect x="330" y="170" width="140" height="140" rx="16" fill="none" stroke="#FB923C" stroke-width="3" filter="url(#glow)"/>
           <rect x="350" y="190" width="30" height="30" fill="#FB923C"/>
           <rect x="420" y="190" width="30" height="30" fill="#FB923C"/>
           <rect x="350" y="260" width="30" height="30" fill="#FB923C"/>
           <circle cx="435" cy="275" r="14" fill="#FB923C"/></g>
  
  <!-- Content overlay -->
  <g font-family="system-ui, -apple-system, sans-serif">
    <!-- Tag -->
    <rect x="40" y="40" width="140" height="26" rx="13" fill="#7C2D12" opacity="0.6"/>
    <text x="50" y="57" font-size="11" font-weight="700" fill="#FB923C" letter-spacing="1">SAAS PLATFORM</text>
    
    <!-- Title and Subtitle -->
    <text x="40" y="420" font-size="28" font-weight="800" fill="#F8FAFC" letter-spacing="-0.5">CafeOS</text>
    <text x="40" y="450" font-size="14" font-weight="400" fill="#94A3B8">Multi-Tenant QR Ordering System for Cafés & Dining</text>
  </g>
</svg>