<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090a10" />
      <stop offset="100%" stop-color="#121422" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  <rect width="100%" height="100%" fill="url(#grid)" />
  
  <!-- Ambient glow orb -->
  <circle cx="400" cy="240" r="180" fill="#C5A880" opacity="0.08" filter="url(#glow)" />
  
  <!-- Icon / Graphics illustration -->
  <g><circle cx="400" cy="240" r="110" stroke="#C5A880" stroke-width="2" stroke-dasharray="6 6" fill="none" opacity="0.4"/>
           <circle cx="400" cy="240" r="80" stroke="#C5A880" stroke-width="3" fill="none" opacity="0.8"/>
           <ellipse cx="400" cy="240" rx="80" ry="30" stroke="#C5A880" stroke-width="2" fill="none" transform="rotate(25 400 240)"/>
           <ellipse cx="400" cy="240" rx="80" ry="30" stroke="#C5A880" stroke-width="2" fill="none" transform="rotate(-40 400 240)"/>
           <circle cx="400" cy="240" r="24" fill="#C5A880" opacity="0.9" filter="url(#glow)"/></g>
  
  <!-- Content overlay -->
  <g font-family="system-ui, -apple-system, sans-serif">
    <!-- Tag -->
    <rect x="40" y="40" width="140" height="26" rx="13" fill="#242a3e" opacity="0.6"/>
    <text x="50" y="57" font-size="11" font-weight="700" fill="#C5A880" letter-spacing="1">3D WEBGL & EXPORT</text>
    
    <!-- Title and Subtitle -->
    <text x="40" y="420" font-size="28" font-weight="800" fill="#F8FAFC" letter-spacing="-0.5">Trivoxa Group</text>
    <text x="40" y="450" font-size="14" font-weight="400" fill="#94A3B8">Persistent Cross-Route Morphing 3D Experience</text>
  </g>
</svg>