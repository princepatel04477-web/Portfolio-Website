<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0709" />
      <stop offset="100%" stop-color="#1e0e16" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  <rect width="100%" height="100%" fill="url(#grid)" />
  
  <!-- Ambient glow orb -->
  <circle cx="400" cy="240" r="180" fill="#FB7185" opacity="0.08" filter="url(#glow)" />
  
  <!-- Icon / Graphics illustration -->
  <g><circle cx="400" cy="240" r="90" stroke="#FB7185" stroke-width="2" fill="none" opacity="0.7"/>
           <circle cx="400" cy="240" r="60" stroke="#FDA4AF" stroke-width="3" fill="none" opacity="0.9"/>
           <polygon points="400,180 435,240 400,300 365,240" fill="none" stroke="#FB7185" stroke-width="2"/>
           <circle cx="400" cy="240" r="8" fill="#FFF" filter="url(#glow)"/></g>
  
  <!-- Content overlay -->
  <g font-family="system-ui, -apple-system, sans-serif">
    <!-- Tag -->
    <rect x="40" y="40" width="140" height="26" rx="13" fill="#881337" opacity="0.6"/>
    <text x="50" y="57" font-size="11" font-weight="700" fill="#FB7185" letter-spacing="1">EXPERIMENTAL 3D</text>
    
    <!-- Title and Subtitle -->
    <text x="40" y="420" font-size="28" font-weight="800" fill="#F8FAFC" letter-spacing="-0.5">AURELIA Concept</text>
    <text x="40" y="450" font-size="14" font-weight="400" fill="#94A3B8">Cinematic 3D WebGL Fine Jewellery Storefront</text>
  </g>
</svg>