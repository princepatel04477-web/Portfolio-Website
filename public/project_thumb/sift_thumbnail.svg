<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081210" />
      <stop offset="100%" stop-color="#0d221c" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  <rect width="100%" height="100%" fill="url(#grid)" />
  
  <!-- Ambient glow orb -->
  <circle cx="400" cy="240" r="180" fill="#34D399" opacity="0.08" filter="url(#glow)" />
  
  <!-- Icon / Graphics illustration -->
  <g><rect x="320" y="170" width="160" height="120" rx="12" fill="none" stroke="#34D399" stroke-width="3" filter="url(#glow)"/>
           <path d="M320 195 L370 195 L390 215 L480 215" stroke="#34D399" stroke-width="2" fill="none"/>
           <circle cx="430" cy="245" r="22" stroke="#6EE7B7" stroke-width="2" fill="none"/>
           <line x1="445" y1="260" x2="465" y2="280" stroke="#6EE7B7" stroke-width="3" stroke-linecap="round"/></g>
  
  <!-- Content overlay -->
  <g font-family="system-ui, -apple-system, sans-serif">
    <!-- Tag -->
    <rect x="40" y="40" width="140" height="26" rx="13" fill="#064E3B" opacity="0.6"/>
    <text x="50" y="57" font-size="11" font-weight="700" fill="#34D399" letter-spacing="1">DESKTOP UTILITY</text>
    
    <!-- Title and Subtitle -->
    <text x="40" y="420" font-size="28" font-weight="800" fill="#F8FAFC" letter-spacing="-0.5">Sift for Windows</text>
    <text x="40" y="450" font-size="14" font-weight="400" fill="#94A3B8">Files by Google Reimagined for Windows Desktop</text>
  </g>
</svg>