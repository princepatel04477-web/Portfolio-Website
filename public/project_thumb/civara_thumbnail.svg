<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a080d" />
      <stop offset="100%" stop-color="#181222" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  <rect width="100%" height="100%" fill="url(#grid)" />
  
  <!-- Ambient glow orb -->
  <circle cx="400" cy="240" r="180" fill="#D4AF37" opacity="0.08" filter="url(#glow)" />
  
  <!-- Icon / Graphics illustration -->
  <g><polygon points="400,160 480,210 450,290 350,290 320,210" fill="none" stroke="#D4AF37" stroke-width="3" filter="url(#glow)"/>
           <polygon points="400,160 440,210 400,290 360,210" fill="none" stroke="#FDE047" stroke-width="1.5" opacity="0.6"/>
           <circle cx="400" cy="225" r="12" fill="#D4AF37" opacity="0.8"/>
           <line x1="320" y1="210" x2="480" y2="210" stroke="#D4AF37" stroke-width="1.5"/></g>
  
  <!-- Content overlay -->
  <g font-family="system-ui, -apple-system, sans-serif">
    <!-- Tag -->
    <rect x="40" y="40" width="140" height="26" rx="13" fill="#4A3B18" opacity="0.6"/>
    <text x="50" y="57" font-size="11" font-weight="700" fill="#D4AF37" letter-spacing="1">AI CAD PIPELINE & LUXURY</text>
    
    <!-- Title and Subtitle -->
    <text x="40" y="420" font-size="28" font-weight="800" fill="#F8FAFC" letter-spacing="-0.5">Civara Jewels</text>
    <text x="40" y="450" font-size="14" font-weight="400" fill="#94A3B8">150+ Jewellery CAD Renders to AI Lifestyle Shoot</text>
  </g>
</svg>